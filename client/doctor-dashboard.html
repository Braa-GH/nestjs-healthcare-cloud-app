<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <title>Healthcare - Doctor Dashboard</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            height: 100vh;
            background-color: #343a40;
            color: white;
            flex-shrink: 0;
            display: none;
        }
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .nav-link {
            color: white;
        }
        .nav-link:hover {
            color: #ffc107;
        }
        @media (min-width: 768px) {
            body {
                flex-direction: row;
            }
            #sidebar {
                display: block;
            }
        }
    </style>
</head>
<body>
   <!-- Sidebar -->
   <div id="sidebar" class="d-none d-md-flex flex-column p-3">
        <h4 class="text-center">Doctor Dashboard</h4>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" href="doctor-application.html">Profile</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" onclick="logout()" style="cursor: pointer;">Logout</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div id="content">
         <!-- Navbar -->
         <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button class="btn btn-dark d-lg-none me-2" id="toggleSidebar">></button>
                <a class="navbar-brand" href="#">Doctor Dashboard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="doctor-application.html">Profile</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container mt-4">
            <hr>

            <h3>My Appointments</h3>
            <div class="d-flex align-items-center gap-2 my-2">
                <input id="appoi-input" type="text" class="form-control" placeholder="search by Name or ID">
                <button class="btn btn-outline-primary" onclick="Search()">search</button>
            </div>
            <div id="appointments" class=""></div>
            <hr class="block my-3">
            <h4>Help a Patient</h4>
            <div class="d-flex align-items-center gap-2 my-2">
                <input id="patient-apps-input" type="text" class="form-control" placeholder="search by Name or ID">
                <button class="btn btn-outline-primary" onclick="patientSearch()">search</button>
            </div>
            <div id="patients" class="row"></div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="ajax.js"></script>
    <script>
        const appointmentsContainer = document.querySelector("#appointments")
        const patientsContainer = document.querySelector("#patients")
        const patientAppSearchInput = document.querySelector("#patient-apps-input");

        async function showAppointments(appointments){
            if(appointments.length > 0){
                await appointments.forEach(async appointment => {
                    const { followups, status, startTime, endTime, periodInMinutes, patientId } = appointment;
                    const startDate = new Date(startTime);
                    const endDate = new Date(endTime);
                    const startDateEl = `${startDate.toDateString()} ${startDate.toLocaleTimeString()}`
                    const endDateEl = `${endDate.toDateString()} ${endDate.toLocaleTimeString()}`
                    let addFollowup = '';
                    
                    const patient = await findPatient(patientId, localStorage.getItem("doctor-token"));
                    const user = await findUser(patient.user, localStorage.getItem("doctor-token"));
                    let profileImgSrc = "assets/imgs/user.jpg";
                    if(user.profileImg){
                        profileImgSrc = `http://localhost:4000/api/user/${patient.user}/profile-img`
                    }
                    let btns = "";
                    let badge = "";
                    let followupsEl = ``;
                    if(followups.length > 0){
                        followups.forEach(followup => {
                            const followupStartDate = new Date(followup.startTime);
                            const followupEndDate = new Date(followup.endTime);
                            const followupStart = `${followupStartDate.toDateString()} ${ followupStartDate.toLocaleTimeString()}`
                            const followupEnd = `${followupEndDate.toDateString()} ${ followupEndDate.toLocaleTimeString()}`
                            followupsEl += `
                                        <div>
                                            you have a follow-up with this patient <br>
                                            at: ${followupStart} <br>
                                            for: ${followup.periodInMinutes} minutes <br>
                                            end: ${followupEnd}

                                            <div class="py-2">
                                                <button class="btn btn-outline-secondary" onclick="cancelFollowUp('${followup._id}')">cancel</button>
                                            </div>
                                        </div>
                            `
                        })
                    }else{
                        followupsEl = "<span class='text-muted'>No Followups</span>"
                    }
                   
                    switch(status){
                        case "waiting":
                            badge = "<span class='badge bg-warning'>waiting</span>";
                            btns = `
                                    <button class="btn btn-outline-success" onclick="acceptAppointment('${appointment._id}')">accept</button>
                                    <button class="btn btn-outline-danger" onclick="rejectAppointment('${appointment._id}')">reject</button>
                                    <button class="btn btn-outline-secondary" onclick="cancelAppointment('${appointment._id}')">cancel</button>
                                    `;
                            break;
                        case "accepted":
                            badge = "<span class='badge bg-success'>accepted</span>";
                            btns = `
                                    <button class="btn btn-outline-secondary" onclick="cancelAppointment('${appointment._id}')">cancel</button>
                                    `;
                                    addFollowup = `
                                <div class="my-2" style="background-color: #eee;">
                                        <div class="card-header " data-bs-toggle="collapse" href="#appointment-${appointment._id}-add-followup">
                                            <h6 >Add Follow-up</h6>
                                        </div>
                                        <div id="appointment-${appointment._id}-add-followup" class="p-3 collapse">
                                            <div class="row">
                                                <div class="col-12 col-md-8 col-lg-6 d-flex align-items-center gap-2">
                                                    At <input class="form-control" type="datetime-local" id="appointment-${appointment._id}-followup-start">
                                                </div>
                                            </div>
                                            <div class="row my-2">
                                                <div class="col-12 col-md-8 col-lg-6 d-flex align-items-center gap-2">
                                                    For <input class="form-control w-50" type="number" id="appointment-${appointment._id}-followup-period"> minutes
                                                </div>
                                            </div>
                                            <div class="d-flex align-items-center p-2">
                                                <button class="btn btn-outline-success" onclick="addFollowup('${appointment._id}')">add</button>
                                            </div>
                                        </div>
                                </div>
                            `;
                            break;
                        case "rejected":
                        badge = "<span class='badge bg-danger'>rejected</span>";
                        btns = `
                                <button class="btn btn-outline-secondary" onclick="cancelAppointment('${appointment._id}')">cancel</button>
                                `;
                            break;
                        case "canceled":
                            badge = "<span class='badge bg-secondary'>canceled</span>";
                    }
                    const appointmentEl = `
                        <div class="card my-2" >
                            <div class="card-header d-flex justify-content-start align-items-center gap-2" data-bs-toggle="collapse" href="#appointment-${appointment._id}">
                                <img src="${profileImgSrc}" alt="user-img" class="d-block rounded-circle" height="30" width="30"/>
                                <span>${user.firstName} ${user.lastName}</span>
                                ${badge}
                            </div>

                            <div id="appointment-${appointment._id}" class="card-body collapse">
                            You have an Appointment with the patient <a href="view-patient.html">${user.firstName} ${user.lastName}</a> <br>
                            at: ${startDateEl} <br>
                            for: ${periodInMinutes} minutes <br>
                            end: ${endDateEl}

                            <div class="p-3 my-2" style="background-color: #eee;">
                                <h6>Follow-ups</h6>
                                ${followupsEl}
                            </div>

                           ${addFollowup}

                            <div class="d-flx gap-2 pt-3 card-footer">
                                ${btns}
                            </div>
                            </div>
                        </div>
                    `;
                    appointmentsContainer.innerHTML += appointmentEl;
                });
            }else {
                appointmentsContainer.innerHTML = "<div>No Appointments!</div>"
            }
        }

        async function setAppointments(){
            const {doctorId} = await getData(localStorage.getItem("doctor-token"));
            const appointments = await getDoctorAppointments(doctorId, localStorage.getItem("doctor-token"));            
            if(appointments){
                showAppointments(appointments);
            }else{
                showAppointments([]);
            }
        }
        setAppointments()

        function viewPatients(patients){
            if(patients.length > 0){
                patients.forEach(async patient => {
                    const user = await findUser(patient.user, localStorage.getItem("doctor-token"));                    
                    const patientApplication = await findPatientApplication(patient.user, localStorage.getItem("doctor-token"));
                    let imgSrc = "assets/imgs/user.jpg";
                    if(user.profileImg){
                        imgSrc = `http://localhost:4000/api/user/${user.id}/profile-img`
                    }
                    let documents = '';
                    if(patientApplication){
                    if(patientApplication.documents.length > 0){
                        patientApplication.documents.forEach(doc => {
                        let files = '';
                        if(doc.files.length > 0){
                            doc.files.forEach(file => {
                                files += `
                                    <li>
                                        <a href="http://localhost:4000/api/document/get-file/${file}" target="_blank" download>${file}</a>
                                    </li>
                                `;
                            })
                        }
                        documents += `
                            <div class="p-2 my-1" style="background-color: #eee;">
                                <h6>${doc.title}</h6>
                                <p>${doc.description}</p>
                                files: <br>
                                <ul>
                                    ${files}
                                </ul>
                            </div>
                        `;
                    })
                    }

                    }
                   
                    const patientEl = `
                    <div class="col-12 col-md-6 col-lg-4">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center gap-2" data-bs-toggle="collapse" href="#collpase-${patient.id}">
                            <div class="d-flex align-items-center gap-2">
                                <img src="${imgSrc}" alt="user-img" class="d-block rounded-circle" height="30" width="30"/>
                                ${user.firstName} ${user.lastName} <br>
                            </div>
                            <button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#patient-${patient.id}-modal">Take appointment</button>
                        </div>
                        <div class="card-body" id="collpase-${patient.id}">
                            <b>contact:</b> <br>
                                phone: ${user.phone} <br>
                                email: ${user.email} <br>
                                Date of birth: ${user.dob} <br>
                            documents:
                            ${documents}
                            <div class="modal fade" id="patient-${patient.id}-modal" data-bs-backdrop="static" tabindex="-1" style="display: none;" aria-hidden="true">
                                <div class="modal-dialog">
                                  <div class="modal-content">
                                    <div class="modal-header">
                                      <h5 class="modal-title" id="">Make Appointment with the patient: ${user.firstName} ${user.lastName}</h5>
                                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <div class="row">
                                            <div class="col-12 col-md-8 col-lg-6 d-flex align-items-center gap-2">
                                                At <input class="form-control" type="datetime-local" id="patient-${patient.id}-app-start">
                                            </div>
                                        </div>
                                        <div class="row my-2">
                                            <div class="col-12 col-md-8 col-lg-6 d-flex align-items-center gap-2">
                                                For <input class="form-control w-50" type="number" id="patient-${patient.id}-app-period"> minutes
                                            </div>
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                                      <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="makeAppointment('${patient.id}')">make</button>
                                    </div>
                                  </div>
                                </div>
                              </div>
                        </div>
                        </div>
                    </div>
                </div>
                    `;
                    patientsContainer.innerHTML += patientEl;
                });
            }else{
                patientsContainer.innerHTML = "<span class='text-muted'>No Patients Found</span>"
            }
        }

        async function setPatients(page){
            const patients = await getPatients(page, localStorage.getItem("doctor-token"));
            if(patients){
                viewPatients(patients);
            }else{
                viewPatients([]);
            }
        }
        setPatients(1);

    </script>
    <script>
        function rejectAppointment(appId){
            rejectAppointmentAjax(appId, localStorage.getItem("doctor-token"));
        }

        function cancelAppointment(appId){
            cancelAppointmentAjax(appId, localStorage.getItem("doctor-token"));
        }

        function addFollowup(appointmentId){
            const startTime = document.querySelector(`#appointment-${appointmentId}-followup-start`).value;
            const periodInMinutes = parseInt(document.querySelector(`#appointment-${appointmentId}-followup-period`).value);
            addFollowupAjax({appointmentId, startTime, periodInMinutes}, localStorage.getItem("doctor-token"));
        }

        async function makeAppointment(patientId){
            const {doctorId} = await getData(localStorage.getItem("doctor-token"));
            const startTime = document.querySelector(`#patient-${patientId}-app-start`).value;
            const periodInMinutes = parseInt(document.querySelector(`#patient-${patientId}-app-period`).value);
            createAppointment({doctorId, patientId, startTime, periodInMinutes});
        }
        
    </script>
</body>
</html>
