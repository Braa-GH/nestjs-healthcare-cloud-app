<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <title>Healthcare - Doctor Profile</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            height: 100vh;
            background-color: #343a40;
            color: white;
            flex-shrink: 0;
            display: none;
        }
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .nav-link {
            color: white;
        }
        .nav-link:hover {
            color: #ffc107;
        }
        @media (min-width: 768px) {
            body {
                flex-direction: row;
            }
            #sidebar {
                display: block;
            }
        }
    </style>
</head>
<body>
       <!-- Sidebar -->
   <div id="sidebar" class="d-none d-md-flex flex-column p-3">
    <h4 class="text-center">Admin Dashboard</h4>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" href="admin-dashboard.html">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="doctors.html">Doctors</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" onclick="logout()" style="cursor: pointer;">Logout</a>
        </li>
    </ul>
</div>

    <!-- Main Content -->
    <div id="content">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button class="btn btn-dark d-lg-none me-2" id="toggleSidebar">></button>
                <a class="navbar-brand" href="#">Patient Profile</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container mt-4">
            <div class="card card-header p-2 my-3">
                <div class="d-flex align-items-start align-items-center gap-4">
                    <img id="profile-img" src="assets/imgs/user.jpg" alt="user-img" class="d-block rounded-circle" height="100" width="100"/>
                    <div class="">
                        <h1 id="user-name"></h1>
                    </div>
                </div>
                <span id="registered-since" class="text-muted ms-5"></span>
                <p class="ms-5 mt-2"></p>
            </div>
            <hr>
            <h5>Documents</h5>
            <div id="documents"></div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="ajax.js"></script>
    <script>
        const patientId = localStorage.getItem("view-patient-for-admin");
        const userName = document.querySelector("#user-name");
        const registeredSince = document.querySelector("#registered-since");
        const profileImg = document.querySelector("#profile-img");
        const docsContainer = document.querySelector("#documents");

        async function setData(){
            const patient = await findPatient(patientId, localStorage.getItem("admin-token"));
            const user = await findUser(patient.user, localStorage.getItem("admin-token"));
            const { firstName, lastName, createdAt } = user;
            userName.innerText = `${firstName} ${lastName}`;
            const date = new Date(createdAt);
            registeredSince.innerText = `user since ${date.toLocaleDateString()}`;

            if(user.profileImg){
                profileImg.src = `http://localhost:4000/api/user/${user.id}/profile-img`
            }else{
                profileImg.src = "assets/imgs/user.jpg";
            }
        }
        setData()

        async function setPatientApplicationInfo(){
            const patient = await findPatient(patientId, localStorage.getItem("admin-token"));
            let application = await getPatientApplicationForAdmin(patient.user, localStorage.getItem("admin-token"));
            const appDocs = application.documents;
            
            if(appDocs.length > 0){
                appDocs.forEach(doc => {
                    const docElement = document.createElement("div");
                    const files = doc.files;
                    let filesEl = "";
                    files.forEach(file => {
                        filesEl += `
                            <a class="" href="http://localhost:4000/api/document/get-file/${file}" target="_blank" download>${file}</a></br>
                        `;
                    });
                    
                    docElement.innerHTML = `
                    <div class="card my-3">
                        <div class="card-header" data-bs-toggle="collapse" href="#document-body-${doc._id}">
                            <h5>${doc.title}</h5>
                        </div>
                        <div class="card-body" id="document-body-${doc._id}">
                            <p>${doc.description}</p>
                            <div>
                                ${filesEl}
                            </div>  
                        </div>
                    </div>
                    `;
                    docsContainer.appendChild(docElement);
                })

            }

        }

        setPatientApplicationInfo()

    </script>
</body>
</html>
