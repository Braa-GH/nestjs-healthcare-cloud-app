<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <title>Healthcare - Patients</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 250px;
            height: 100vh;
            background-color: #343a40;
            color: white;
            flex-shrink: 0;
            display: none;
        }
        #content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .nav-link {
            color: white;
        }
        .nav-link:hover {
            color: #ffc107;
        }
        @media (min-width: 768px) {
            body {
                flex-direction: row;
            }
            #sidebar {
                display: block;
            }
        }
    </style>
</head>
<body>
   <!-- Sidebar -->
   <div id="sidebar" class="d-none d-md-flex flex-column p-3">
    <h4 class="text-center">Admin Dashboard</h4>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a class="nav-link" href="user-dashboard.html">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="">Doctors</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="">Patients</a>
        </li>
    </ul>
   </div>

    <!-- Main Content -->
    <div id="content">
         <!-- Navbar -->
         <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <button class="btn btn-dark d-lg-none me-2" id="toggleSidebar">></button>
                <a class="navbar-brand" href="#">Admin Dashboard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="admin-dashboard.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="doctors.html">Doctors</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="container mt-4">
            <div class="d-flex align-items-center gap-2 my-2">
                <input type="text" class="form-control" placeholder="search for a patient by his Name or ID">
                <button class="btn btn-outline-primary">search</button>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Info</th>
                            <th>ID</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patients-table-body">
                        
                    </tbody>
                </table>
            </div>

            <div class="d-flex justify-content-between">
                <button class="btn btn-primary" onclick="previousPage()">previous page</button>
                <button class="btn btn-primary" onclick="nextPage()">next page</button>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="ajax.js"></script>
    <script>
        const patientsTableBody = document.querySelector("#patients-table-body");
        let page = 1;
        
        async function viewPatients(page){
            patientsTableBody.innerHTML = "";            
            let patients = await getPatients(page);
            if(patients.length <= 0){
                patientsTableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="text-center">No Content</td>
                </tr>
                `;
            }else {
                await patients.forEach(async (patient,index) => {
                const userData = await findUser(patient.user, localStorage.getItem("admin-token"));
                let imageSrc = "assets/imgs/user.jpg";
                if(userData.profileImg){
                    imageSrc = `http://localhost:4000/api/user/${patient.user}/profile-img`
                }
                patientsTableBody.innerHTML += `
                    <tr>
                        <td class="">${index + 1}</td>
                        <td class="">
                            <div class="d-flex gap-2 align-items-center">
                                <img id="profile-img" src="${imageSrc}" alt="user-img" class="d-block rounded-circle" height="30" width="30"/>
                                <span>${userData.firstName} ${userData.lastName}</span>
                            </div>
                        </td>
                        <td class="">${patient.id}</td>
                        <td class="">
                            <button class="btn btn-primary" onclick="viewPatientForAdmin('${patient.id}')">view</button>  
                            <button class="btn btn-danger" onclick="deletePatient('${patient.id}')">delete</button>  
                        </td>
                    </tr>
                `; 
            });   
            }
        }
        viewPatients(page);

        function nextPage(){
            viewPatients(++page);
        }

        function previousPage(){
            viewPatients(--page);
        }

        function viewPatientForAdmin(patientId){
            localStorage.setItem("view-patient-for-admin", patientId);
            window.location.assign("/view-patient.html")
        }

        function deletePatient(patientId){
            deletePatientAjax(patientId);
        }
    </script>
</body>
</html>
